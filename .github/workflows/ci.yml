name: CI

# Release-readiness checks for the RADAR frontend + Base44 schema. This
# repo had no CI at all before the 2026-08-03 RADAR audit pass — five prior
# security-fix PRs (#5-#10) merged with only local, manual verification.
#
# `typecheck` and `npm audit` run informationally (continue-on-error) rather
# than blocking: as of 2026-08-03 there are 236 pre-existing `tsc` errors
# (JSX prop-type mismatches, unrelated to any single change), and as of
# 2026-08-05 (v0.1.1, react-router-dom v6→v7) there is one high-severity
# react-router advisory (GHSA-qwww-vcr4-c8h2, RSC-mode CSRF) that does not
# apply to this app — see CHANGELOG.md [0.1.1]. Neither is safe to silently
# block every future PR on; both are tracked in
# docs/2026-08-03-audit-rollback.md instead. Promote either step to
# blocking once its backlog is cleared.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # A stalled step otherwise runs to GitHub's 6-hour default and bills every minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno tests (import-free helpers under base44/tests)
        run: deno test base44/tests/

      - name: Build
        run: npm run build

      - name: Validate entity RLS rules
        run: npm run validate:rls

      - name: Typecheck (informational — known pre-existing errors, non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Dependency audit (informational — non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
