name: CI

# Release-readiness checks for the RADAR frontend + Base44 schema. This
# repo had no CI at all before the 2026-08-03 RADAR audit pass — five prior
# security-fix PRs (#5-#10) merged with only local, manual verification.
#
# `typecheck` and `npm audit` run informationally (continue-on-error) rather
# than blocking: as of 2026-08-03 there are 236 pre-existing `tsc` errors
# (JSX prop-type mismatches, unrelated to any single change) and one
# moderate react-router-dom advisory that requires a major-version bump to
# clear. Neither is safe to silently block every future PR on; both are
# tracked in docs/2026-08-03-audit-rollback.md instead. Promote either step
# to blocking once its backlog is cleared.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate entity RLS rules
        run: npm run validate:rls

      - name: Typecheck (informational — known pre-existing errors, non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Dependency audit (informational — non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
